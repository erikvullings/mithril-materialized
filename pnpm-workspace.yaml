packages:
  - packages/**
  - '!**/test/**'

allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@semantic-release/changelog@7.0.0'
  - '@semantic-release/git@11.0.0 || 11.0.1'
  - '@testing-library/jest-dom@7.0.0'
  - sass@1.101.3 || 1.101.7
  - '@mithril-inspector/adapter-kit@0.3.1 || 0.3.2'
  - '@mithril-inspector/overlay@0.3.1 || 0.3.2'
  - '@mithril-inspector/protocol@0.3.1 || 0.3.2'
  - '@mithril-inspector/runtime@0.3.1 || 0.3.2'
  - '@mithril-inspector/server@0.3.1 || 0.3.2'
  - '@mithril-inspector/transform@0.3.1 || 0.3.2'
  - '@mithril-inspector/vite@0.3.1 || 0.3.2'
  - js-yaml@5.2.2
  - pnpm@11.17.0

onlyBuiltDependencies:
  - '@parcel/watcher'
  - unrs-resolver

overrides:
  '@ungap/structured-clone': '1.3.1'
  ajv: '>=8.18.0'
  '@babel/runtime@<7.26.10': '>=7.26.10'
  brace-expansion@>=1.0.0 <=1.1.11: '>=1.1.12'
  brace-expansion@>=2.0.0 <=2.0.1: '>=2.0.2'
  braces@<3.0.3: '>=3.0.3'
  cross-spawn@>=7.0.0 <7.0.5: '>=7.0.5'
  follow-redirects@<=1.15.5: '>=1.15.6'
  lodash: '>=4.17.23'
  markdown-it: '>=14.1.1'
  micromatch@<4.0.8: '>=4.0.8'
  minimatch: '>=3.1.4'
  nanoid@<3.3.8: '>=3.3.8'
  on-headers@<1.1.0: '>=1.1.0'
  qs: '>=6.14.2'
  svgo: '>=2.8.2'
