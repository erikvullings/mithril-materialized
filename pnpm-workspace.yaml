packages:
  - packages/**
  - '!**/test/**'

allowBuilds:
  '@parcel/watcher': true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@semantic-release/changelog@7.0.0'
  - '@semantic-release/git@11.0.0 || 11.0.1'
  - '@testing-library/jest-dom@7.0.0'
  - sass@1.101.3 || 1.101.7
  - '@mithril-inspector/adapter-kit@0.3.1 || 0.3.2'
  - '@mithril-inspector/overlay@0.3.1 || 0.3.2'
  - '@mithril-inspector/protocol@0.3.1 || 0.3.2'
  - '@mithril-inspector/runtime@0.3.1 || 0.3.2'
  - '@mithril-inspector/server@0.3.1 || 0.3.2'
  - '@mithril-inspector/transform@0.3.1 || 0.3.2'
  - '@mithril-inspector/vite@0.3.1 || 0.3.2'
  - js-yaml@4.1.2 || 4.3.0 || 4.3.1 || 5.2.2
  - pnpm@11.17.0
  - vite@8.2.1
  - undici@6.27.0 || 6.28.0 || 7.18.2 || 7.24.0 || 7.28.0 || 7.29.0
  - handlebars@4.7.9
  - picomatch@2.3.2 || 4.0.4
  - yaml@1.10.3
  - lodash-es@4.17.23 || 4.17.24
  - ws@8.20.1 || 8.21.0
  - immutable@5.1.8
  - brace-expansion@5.0.8 || 5.0.9

onlyBuiltDependencies:
  - '@parcel/watcher'
  - unrs-resolver

